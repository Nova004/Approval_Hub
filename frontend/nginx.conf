server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Root redirect to base path
    location = / {
        return 301 /approval_hub/;
    }

    # API Reverse Proxy (support both /approval_hub/api/ and /api/)
    location /approval_hub/api/ {
        proxy_pass http://backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Vite React SPA under /approval_hub/
    location /approval_hub/ {
        try_files $uri $uri/ /approval_hub/index.html;
    }

    # Cache static assets (Vite generates hash filenames in assets/)
    location ~* ^/approval_hub/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }
}

